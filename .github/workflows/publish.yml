name: Publish

on:
  push:
    branches:
      - master
    paths:
      - RELEASE_NOTES.md
      - .github/workflows/publish.yml

permissions:
  contents: write
  packages: write

jobs:
  pack:
    name: Package
    runs-on: windows-latest
    env:
      PIXCODEC_TESTDATA: ${{ github.workspace }}\testdata
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout test data
        uses: actions/checkout@v4
        with:
          repository: krauthaufen/Aardvark.PixImage.PixCodec.TestData
          path: testdata
      - name: Install Dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
      - name: Restore Tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet paket restore
      - name: Build
        run: dotnet build -c Release Aardvark.PixImage.PixCodec.slnx
      - name: Test
        run: dotnet test Aardvark.PixImage.PixCodec.slnx -c Release --no-build --nologo
      - name: Pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet aardpack Aardvark.PixImage.PixCodec.slnx --notag
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: bin\pack
      - name: GitHub Packages
        env:
          NUGET_KEY: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: dotnet nuget push "bin\pack\*.nupkg" -k %NUGET_KEY% -s "https://nuget.pkg.github.com/krauthaufen/index.json" --skip-duplicate
      - name: NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        shell: cmd
        run: dotnet nuget push "bin\pack\*.nupkg" -k %NUGET_KEY% -s "https://api.nuget.org/v3/index.json" --skip-duplicate
