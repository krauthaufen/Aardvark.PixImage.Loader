name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - RELEASE_NOTES.md
      - .github/workflows/publish.yml

permissions:
  contents: write
  packages: write

jobs:
  testdata:
    name: Test data
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Container tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates unzip zstd python3 python3-venv libtiff6 imagemagick > /dev/null
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout test data
        uses: actions/checkout@v7
        with:
          repository: krauthaufen/Aardvark.PixImage.PixCodec.TestData
          path: testdata
      - name: Fetch downloaded test data
        uses: ./.github/actions/testdata
        with:
          mode: fetch

  pack:
    name: Package
    needs: testdata
    runs-on: windows-latest
    env:
      PIXCODEC_TESTDATA: ${{ github.workspace }}\testdata
      PIXCODEC_REQUIRE_ORACLES: 1
      PIXCODEC_ORACLE_EXEMPT: jxrlib   # jxrlib does not build with MinGW
      VSTEST_CONNECTION_TIMEOUT: 600
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout test data
        uses: actions/checkout@v7
        with:
          repository: krauthaufen/Aardvark.PixImage.PixCodec.TestData
          path: testdata
      - name: Restore downloaded test data
        uses: ./.github/actions/testdata
        with:
          mode: restore
      - name: Oracles
        uses: ./.github/actions/oracles
      - name: Install Dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json
      - name: Restore Tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet paket restore
      - name: Build
        run: dotnet build -c Release Aardvark.PixImage.PixCodec.slnx
      - name: Test
        shell: bash
        run: |
          export PATH="$PATH:/c/cygwin/bin"   # netpbm from Cygwin, after everything else
          dotnet test Aardvark.PixImage.PixCodec.slnx -c Release --no-build --nologo
      - name: Pack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet aardpack Aardvark.PixImage.PixCodec.slnx --notag
      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: bin\pack
      - name: GitHub Packages
        env:
          NUGET_KEY: ${{ secrets.GITHUB_TOKEN }}
        shell: cmd
        run: dotnet nuget push "bin\pack\*.nupkg" -k %NUGET_KEY% -s "https://nuget.pkg.github.com/krauthaufen/index.json" --skip-duplicate
      - name: NuGet
        env:
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
        shell: cmd
        run: dotnet nuget push "bin\pack\*.nupkg" -k %NUGET_KEY% -s "https://api.nuget.org/v3/index.json" --skip-duplicate
