name: Build

on:
  push:
    paths-ignore:
    - 'README.md'
    - 'RELEASE_NOTES.md'
  pull_request:
    paths-ignore:
    - 'README.md'
    - 'RELEASE_NOTES.md'
  workflow_dispatch:

jobs:
  testdata:
    name: Test data
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
    - name: Container tools
      run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git curl ca-certificates unzip zstd python3 python3-venv libtiff6 > /dev/null

    - uses: actions/checkout@v4

    - name: Checkout test data
      uses: actions/checkout@v4
      with:
        repository: krauthaufen/Aardvark.PixImage.PixCodec.TestData
        path: testdata

    - name: Fetch downloaded test data
      uses: ./.github/actions/testdata
      with:
        mode: fetch

  build:
    needs: testdata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PIXCODEC_TESTDATA: ${{ github.workspace }}/testdata
      # every oracle gate fails instead of skipping (see AGENTS.md, Tests); PIXCODEC_ORACLE_EXEMPT would list the gates a
      # platform cannot provide (none at the moment)
      PIXCODEC_REQUIRE_ORACLES: 1
    steps:
    - name: Keep line endings
      run: git config --global core.autocrlf false

    - uses: actions/checkout@v4

    - name: Checkout test data
      uses: actions/checkout@v4
      with:
        repository: krauthaufen/Aardvark.PixImage.PixCodec.TestData
        path: testdata

    - name: Restore downloaded test data
      uses: ./.github/actions/testdata
      with:
        mode: restore

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        global-json-file: global.json

    - name: Cache Paket
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-paket-${{ hashFiles('paket.lock') }}
        restore-keys: |
          ${{ runner.os }}-paket-

    - name: Oracles
      uses: ./.github/actions/oracles

    - name: Build
      run: bash ./build.sh

    - name: Test
      shell: bash
      run: |
        # Windows: netpbm from Cygwin, after everything else
        [ "$RUNNER_OS" = Windows ] && export PATH="$PATH:/c/cygwin/bin"
        dotnet test Aardvark.PixImage.PixCodec.slnx -c Release --no-build --nologo --blame --results-directory TestResults

    - name: Upload test diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}
        path: TestResults
