name: Test oracles
description: >
  Everything the tests run as reference (see tests/oracle/ci): python with tests/oracle/requirements.txt, the command
  line tools (install.sh) and the ones built from source (build.sh), cached per operating system.
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tests/oracle/requirements.txt

    - name: Python packages
      shell: bash
      run: python -m pip install -q -r tests/oracle/requirements.txt

    - name: Restore tools
      id: tools
      uses: actions/cache/restore@v4
      with:
        path: .tmp/ci-tools
        key: ${{ runner.os }}-oracles-v1-${{ hashFiles('tests/oracle/ci/*', 'tests/oracle/exr_oracle.cpp') }}

    - name: Build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libopenexr-dev zlib1g-dev pkg-config > /dev/null

    - name: Build dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew install --quiet openexr pkgconf > /dev/null

    - name: Build dependencies (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        install: >-
          make
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-openexr
          mingw-w64-x86_64-pkgconf

    - name: Netpbm (Windows, Cygwin)
      if: runner.os == 'Windows'
      uses: cygwin/cygwin-install-action@v4
      with:
        packages: netpbm
        add-to-path: false

    - name: Build oracles
      if: runner.os != 'Windows'
      shell: bash
      run: bash tests/oracle/ci/build.sh

    - name: Build oracles (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: bash tests/oracle/ci/build.sh

    - name: Install oracles
      shell: bash
      run: bash tests/oracle/ci/install.sh

    - name: Save tools
      if: steps.tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .tmp/ci-tools
        key: ${{ steps.tools.outputs.cache-primary-key }}
